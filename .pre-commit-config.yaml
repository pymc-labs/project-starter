repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespellignore", "--skip=*.ipynb"]
# prok:start

  # The commit hook of prok: refuses a commit while prok's graph has errors or a constraint is broken.
  # It does nothing where prok is not installed, such as in CI, or where the repository does not use prok.
  - repo: local
    hooks:
      - id: prok
        name: prok constraints
        entry: sh -c '[ -f .prok/central.yaml ] && command -v prok >/dev/null 2>&1 || exit 0; prok validate && prok enforce-constraints'
        language: system
        pass_filenames: false
        always_run: true
# prok:end
