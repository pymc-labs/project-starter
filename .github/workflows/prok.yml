# prok checks the world of each pull request against the project's canon, puts the automatic review on the pull
# request, and canonizes the world once the pull request is merged. It logs in without a key, as a workflow of this
# repository, which setup names as the project's own (prok project add-repository).
name: prok

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

# The checks of one ref queue behind each other; a canonization never shares a group with anything, so nothing cancels it.
concurrency:
  group: prok-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  prok:
    # Not in the starter itself, which is no prok project; in every project made from it.
    if: github.repository != 'pymc-labs/project-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Only once setup has connected the project to prok: the first commit of a new repository comes before that.
      # Dependabot is no person of prok, so there is no world of its own to check.
      - if: hashFiles('.prok/central.yaml') != '' && github.actor != 'dependabot[bot]'
        uses: pymc-labs/prok/ci@v0.1.8
